# AG-06 DAST — Lab costo cero (ADR-002)
# Ejecuta pruebas dinámicas de seguridad con un GATE de verificación de propiedad
# obligatorio antes de cualquier prueba activa. Perfil no destructivo.
#
# Modos de objetivo:
#   lab      -> levanta OWASP Juice Shop en el propio runner (localhost). Sin gate (es nuestro).
#   external -> URL propia/autorizada. EXIGE token en /.well-known/soc-verify.txt antes de escanear.
#
# v1.0.1 (15-oct-2026):
#   - Inputs y salidas por env: (nunca ${{ }} dentro de run:) -> corrige run-shell-injection.
#   - target_url validada con regex estricta (solo https, sin credenciales ni caracteres de shell).
#   - verify_token validado (16-128 caracteres [A-Za-z0-9_-]).
#   - Anti-SSRF (G4) reforzado: normaliza host (minúsculas, sin puerto) y resuelve DNS;
#     bloquea si CUALQUIER IP es privada, loopback, link-local, reservada o metadata.
#   - runs-on fijado a ubuntu-24.04 (migración de ubuntu-latest a Ubuntu 26 el 19-oct).
# v1.1 (17-oct-2026):
#   - AJAX spider en ZAP (input ajax_spider): descubre la API /rest de SPAs Angular/React.
#     El run #11 no detectó SQLi/XSS en Juice Shop por no recorrer la SPA; esto lo corrige.
#   - Enumeración de usuarios real (T2/T5/T7): input login_path -> dast_logic.py --login-path
#     compara respuestas de usuario válido-aparente vs inexistente (no destructivo).
#   - Consolidador filtra ruido informativo (Modern Web App, User Agent Fuzzer, etc.).
#   - Gate ADR-004: verify_method = file | dns | meta (a elección del cliente).
#   - T6: dast_logic.py resuelve <script src> relativos (bundles Angular/Vite/Lovable).
# v1.1.1 (17-oct-2026): run #12 cancelado a los 45 min (ZAP 42,7 min) sin artefacto.
#   - Orden: lógica y Nuclei antes que ZAP; ZAP con presupuesto ~27 min y corte duro.
#   - Consolidación y artefacto con always(): siempre hay informe con lo disponible.
#   - Job 55 min; timeout por paso.
# v1.1.2 (17-oct-2026): límite del active scan con la clave correcta scanner.* (run #13 sin zap.json).
# v1.1.3 (17-oct-2026): alcance G5 — contexto ZAP limitado al host objetivo (run #14 salió a github.com);
#   el consolidador descarta hallazgos de otros hosts.
# v1.1.4 (17-oct-2026): zap.log en el artefacto + aviso explícito si ZAP no genera reporte
#   (run #15 terminó "bien" pero sin zap.json y sin forma de ver por qué).
name: AG-06 DAST

on:
  workflow_dispatch:
    inputs:
      target_mode:
        description: "lab (Juice Shop local) o external (URL propia verificada)"
        type: choice
        options: [lab, external]
        default: lab
      target_url:
        description: "URL objetivo (solo external, https). Ej: https://miapp.example"
        required: false
        default: ""
      verify_token:  # gitleaks:allow — nombre del input; el valor se publica en /.well-known, no es un secreto
        description: "Token de verificación de propiedad (solo external)"
        required: false
        default: ""
      verify_method:
        description: "Método de verificación (ADR-004): file=/.well-known/soc-verify.txt · dns=TXT soc-verify=<token> · meta=<meta name=soc-verify>"
        type: choice
        options: [file, dns, meta]
        default: file
      active_scan:
        description: "Incluir fase activa (ZAP + Nuclei)"
        type: boolean
        default: true
      ajax_spider:
        description: "Spider de navegador en ZAP (Client spider, -j): necesario para SPAs Angular/React con API /rest"
        type: boolean
        default: true
      login_path:
        description: "Ruta de login para pruebas de enumeración (ej: /rest/user/login). Vacío = omite T2/T5/T7"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: ag06-dast
  cancel-in-progress: false

jobs:
  ag06-dast:
    name: AG-06 Escaneo DAST
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      IN_MODE: ${{ inputs.target_mode }}
      IN_URL: ${{ inputs.target_url }}
      IN_TOKEN: ${{ inputs.verify_token }}
      IN_LOGIN: ${{ inputs.login_path }}
      IN_METHOD: ${{ inputs.verify_method }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Preparar entorno
        run: |
          echo "OUT=$RUNNER_TEMP/dast" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dast"
          chmod -R 777 "$RUNNER_TEMP/dast"
          case "$IN_MODE" in
            lab|external) echo "Modo: $IN_MODE" ;;
            *) echo "::error::target_mode inválido"; exit 1 ;;
          esac
          # login_path (opcional): solo ruta simple, sin metacaracteres de shell ni query string.
          if [ -n "$IN_LOGIN" ] && ! [[ "$IN_LOGIN" =~ ^/[A-Za-z0-9._~/-]*$ ]]; then
            echo "::error::login_path con formato no permitido (solo /ruta/simple)."; exit 1
          fi

      # ---------- Resolver objetivo, levantar app y GATE de propiedad ----------
      - name: Resolver objetivo y verificar propiedad
        id: target
        run: |
          set -euo pipefail

          if [ "$IN_MODE" = "lab" ]; then
            echo "Levantando OWASP Juice Shop..."
            docker run -d --name juiceshop -p 3000:3000 bkimminich/juice-shop:latest
            echo "Esperando a que responda (hasta 3 min)..."
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:3000/" >/dev/null 2>&1; then
                echo "Juice Shop arriba tras $((i*3))s."; break
              fi
              sleep 3
            done
            {
              echo "TARGET=http://localhost:3000"
              echo "TARGET_HOST=localhost:3000"
            } >> "$GITHUB_ENV"
            echo "host=localhost" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- modo external ---
          if [ -z "$IN_URL" ] || [ -z "$IN_TOKEN" ]; then
            echo "::error::En modo external se requieren target_url y verify_token."; exit 1
          fi

          # Formato estricto: solo https, host DNS, puerto opcional, ruta simple.
          # Sin '@', espacios, comillas, '$', ';', '`', '|', '&', saltos de línea ni query string.
          URL_RE='^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$'
          if ! [[ "$IN_URL" =~ $URL_RE ]]; then
            echo "::error::target_url con formato no permitido (solo https://host[:puerto][/ruta])."; exit 1
          fi
          if ! [[ "$IN_TOKEN" =~ ^[A-Za-z0-9_-]{16,128}$ ]]; then
            echo "::error::verify_token con formato no permitido (16-128 caracteres A-Z a-z 0-9 _ -)."; exit 1
          fi

          HOSTPORT="${IN_URL#https://}"; HOSTPORT="${HOSTPORT%%/*}"
          HOST="${HOSTPORT%%:*}"; HOST="${HOST,,}"; HOST="${HOST%.}"

          # Anti-SSRF (G4) — nombres prohibidos
          case "$HOST" in
            localhost|*.localhost|*.local|*.internal|*.home.arpa|metadata|metadata.*)
              echo "::error::Objetivo prohibido ($HOST). Bloqueado por G4."; exit 1;;
          esac

          # Anti-SSRF (G4) — todas las IPs a las que resuelve deben ser públicas
          IPS=$(getent ahosts "$HOST" | awk '{print $1}' | sort -u || true)
          if [ -z "$IPS" ]; then
            echo "::error::$HOST no resuelve en DNS."; exit 1
          fi
          for ip in $IPS; do
            if python3 -c 'import ipaddress,sys; a=ipaddress.ip_address(sys.argv[1]); sys.exit(0 if (a.is_private or a.is_loopback or a.is_link_local or a.is_reserved or a.is_multicast or a.is_unspecified) else 1)' "$ip"; then
              echo "::error::$HOST resuelve a una IP no pública ($ip). Bloqueado por G4."; exit 1
            fi
          done
          echo "IPs verificadas (públicas): $(echo $IPS | tr '\n' ' ')"

          # Verificación de propiedad (G1/G2) — ADR-004: 3 métodos a elección del cliente.
          # Ninguno sigue redirecciones (un 30x a otro host no prueba control del objetivo).
          OK=0
          case "$IN_METHOD" in
            file)
              GOT=$(curl -fsS --max-time 15 --max-filesize 4096 --proto '=https' \
                    "https://$HOSTPORT/.well-known/soc-verify.txt" 2>/dev/null | tr -d '[:space:]' || true)
              [ "$GOT" = "$IN_TOKEN" ] && OK=1 ;;
            dns)
              # TXT en el host exacto o en _soc-verify.<host>. dig viene en ubuntu-24.04 (dnsutils).
              for NAME in "$HOST" "_soc-verify.$HOST"; do
                if dig +short TXT "$NAME" 2>/dev/null | tr -d '"' | grep -qxF "soc-verify=$IN_TOKEN"; then
                  OK=1; break
                fi
              done ;;
            meta)
              # <meta name="soc-verify" content="TOKEN"> en el HTML de la URL exacta (máx. 512 KB).
              curl -fsS --max-time 15 --max-filesize 524288 --proto '=https' "$IN_URL" \
                -o "$RUNNER_TEMP/verify.html" 2>/dev/null || true
              if python3 - "$RUNNER_TEMP/verify.html" "$IN_TOKEN" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8", errors="replace").read() if __import__("os").path.exists(sys.argv[1]) else ""
          tok = sys.argv[2]
          for tag in re.findall(r"<meta\b[^>]*>", html, re.I):
              if re.search(r"""name\s*=\s*["']soc-verify["']""", tag, re.I):
                  m = re.search(r"""content\s*=\s*["']([^"']*)["']""", tag, re.I)
                  if m and m.group(1).strip() == tok:
                      sys.exit(0)
          sys.exit(1)
          PY
              then OK=1; fi ;;
            *) echo "::error::verify_method inválido"; exit 1 ;;
          esac
          if [ "$OK" != "1" ]; then
            echo "::error::Verificación de propiedad FALLIDA para $HOST (método: $IN_METHOD). Sin propiedad verificada no se escanea (G1)."
            exit 1
          fi
          echo "Propiedad verificada para $HOST (método: $IN_METHOD)."
          echo "VERIFY_METHOD=$IN_METHOD" >> "$GITHUB_ENV"
          {
            echo "TARGET=$IN_URL"
            echo "TARGET_HOST=$HOSTPORT"
          } >> "$GITHUB_ENV"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      # ---------- Fase pasiva ----------
      - name: testssl.sh (TLS / cifrados / CAA)  [T13, T14]
        if: steps.target.outputs.host != 'localhost'
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/testssl/testssl.sh.git /tmp/testssl
          /tmp/testssl/testssl.sh --jsonfile "$OUT/testssl.json" \
            --protocols --cipher-categories --headers "$TARGET_HOST" || true

      - name: Detección de secretos en JS público  [T6]
        continue-on-error: true
        run: |
          python3 scripts/dast_logic.py secrets \
            --target "$TARGET" \
            --out "$OUT/secrets.json" || true

      # ---------- Fase activa ----------
      # v1.1.1: primero lo rápido (lógica, Nuclei), ZAP al final. Si ZAP se pasa de tiempo,
      # lo demás ya quedó guardado y la consolidación/artefacto corren igual (always()).

      # ---------- Lógica de negocio ----------
      - name: Pruebas de lógica (rate limit, enumeración)  [T2, T3, T5, T7]
        if: ${{ inputs.active_scan }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          LOGIN_ARG=""
          if [ -n "$IN_LOGIN" ]; then
            LOGIN_ARG="--login-path $IN_LOGIN"
          fi
          python3 scripts/dast_logic.py logic \
            --target "$TARGET" \
            $LOGIN_ARG \
            --out "$OUT/logic.json" || true

      - name: Nuclei  [T11 TRACE, T12 smuggling, misconfig]
        if: ${{ inputs.active_scan }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          NV=$(curl -fsSL https://api.github.com/repos/projectdiscovery/nuclei/releases/latest \
               | grep -oP '"tag_name":\s*"v\K[^"]+' || true)
          if [ -n "$NV" ]; then
            curl -fsSL -o /tmp/nuclei.zip \
              "https://github.com/projectdiscovery/nuclei/releases/download/v${NV}/nuclei_${NV}_linux_amd64.zip" || true
            unzip -o /tmp/nuclei.zip -d /tmp/nuclei >/dev/null 2>&1 || true
            if [ -x /tmp/nuclei/nuclei ]; then
              timeout 8m /tmp/nuclei/nuclei -u "$TARGET" \
                -severity low,medium,high,critical -rate-limit 30 -timeout 5 \
                -jsonl -o "$OUT/nuclei.jsonl" -silent || true
            fi
          fi

      # ZAP full scan = spider + (opcional) spider de navegador + escaneo ACTIVO, acotado.
      # v1.1.3 — ALCANCE (G5): sin archivo de contexto ZAP no restringe nada y el run #14
      # navegó a github.com (8 hallazgos de terceros). Ahora se genera ag06.context con
      # incregex = SOLO el host del objetivo y se pasa con -n. Spider, spider de navegador y
      # active scan quedan limitados a ese contexto (verificado en zap_common.py de ZAP).
      # Nota: en ZAP actual "-j" usa el Client spider (no el AJAX spider, que exige
      # --ajax-spider). El Client spider fue el que descubrió /rest y /api en el run #14.
      # Presupuesto:
      #   -m 3                         spider tradicional y Client spider, 3 min cada uno
      #   -T 5                         máx. 5 min esperando arranque + escaneo pasivo
      #   scanner.maxScanDurationInMins=12  el active scan se corta a 12 min y escribe el reporte
      #   scanner.maxRuleDurationInMins=2   ninguna regla individual > 2 min
      #   timeout 28m + docker kill    corte duro; el contenedor tiene nombre para matarlo seguro
      # Perfil activo: seguro contra Juice Shop local; contra apps de clientes exige su
      # autorización y propiedad verificada (ADR-004, gate previo).
      - name: OWASP ZAP full scan (activo, acotado)  [T9, T10, inyecciones, params]
        if: ${{ inputs.active_scan }}
        continue-on-error: true
        timeout-minutes: 31
        env:
          IN_AJAX: ${{ inputs.ajax_spider }}
        run: |
          # Contexto de alcance: solo el host[:puerto] del objetivo (TARGET_HOST viene del gate).
          python3 - "$TARGET_HOST" "$OUT/ag06.context" <<'PY'
          import re, sys
          from xml.sax.saxutils import escape
          hostport, out = sys.argv[1], sys.argv[2]
          host, _, port = hostport.partition(":")
          rx = "^https?://" + re.escape(host) + (r"(:" + port + ")?" if port else r"(:[0-9]+)?") + r"(/.*)?$"
          open(out, "w", encoding="utf-8").write(
              '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n'
              "<configuration><context><name>ag06</name><desc>AG-06 alcance</desc>"
              "<inscope>true</inscope><incregexes>" + escape(rx) + "</incregexes>"
              "</context></configuration>\n")
          print("Alcance ZAP:", rx)
          PY
          chmod 666 "$OUT/ag06.context"

          # v1.1.2: la clave correcta es scanner.* (verificado en ScannerParam.java de ZAP).
          ZAP_Z="-config scanner.maxScanDurationInMins=12 -config scanner.maxRuleDurationInMins=2"
          ZAP_Z="$ZAP_Z -config scanner.threadPerHost=4"
          BROWSER_FLAG=""
          if [ "$IN_AJAX" = "true" ]; then
            BROWSER_FLAG="-j"   # Client spider (navegador) dentro del contexto
          fi
          timeout --kill-after=30s 28m docker run --rm --name ag06-zap --network host \
            -v "$OUT":/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py -t "$TARGET" -n ag06.context \
            -J zap.json -r zap.html -I -m 3 -T 5 $BROWSER_FLAG \
            -z "$ZAP_Z" > "$OUT/zap.log" 2>&1
          ZRC=$?
          echo "zap-full-scan exit code: $ZRC" | tee -a "$OUT/zap.log"
          tail -n 40 "$OUT/zap.log" || true
          # 0/1/2 = terminó (sin/ con WARN / con FAIL). 3 = error de ZAP. 124/137 = corte por tiempo.
          if [ ! -s "$OUT/zap.json" ]; then
            echo "::error::ZAP no generó zap.json (exit $ZRC). Ver zap.log en el artefacto."
          fi
          docker kill ag06-zap >/dev/null 2>&1 || true
          ls -la "$OUT" || true

      # ---------- Consolidación (siempre, con lo que haya) ----------
      - name: Consolidar hallazgos -> findings.json
        if: always() && steps.target.outcome == 'success'
        run: |
          python3 scripts/dast_consolidar.py "$OUT" \
            --target "$TARGET" \
            --mode "$IN_MODE" \
            --out "$OUT/findings.json" \
            --summary "$OUT/informe-dast.md"
          cat "$OUT/informe-dast.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Detener Juice Shop (lab)
        if: always() && inputs.target_mode == 'lab'
        run: docker rm -f juiceshop || true

      - name: Publicar artefacto
        if: always() && steps.target.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: informe-ag06
          path: ${{ runner.temp }}/dast
          retention-days: 14
