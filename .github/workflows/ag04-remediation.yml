# AG-04 Remediation — Lab costo cero (ADR-002)
# ADR-001 v1.1: abre un PR por paquete en ramas soc/fix-*; nunca hace merge.
# La aprobación humana es la revisión y el merge del PR (branch protection en main).
# v1.0.1 (15-oct-2026): expresiones ${{ }} pasadas por env: (Semgrep run-shell-injection) + validación numérica de run_id.
name: AG-04 Remediation

on:
  workflow_run:
    workflows: ["AG-01 Orquestador"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID del run de AG-01 (vacío = último exitoso en main)"
        required: false
      dry_run:
        description: "Solo simular (no abre PRs)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ag04-remediation
  cancel-in-progress: false

env:
  MAX_OPEN_PRS: "5"

jobs:
  ag04-remediar:
    name: AG-04 Remediar dependencias
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolver ejecución de AG-01
        id: src
        env:
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          RID="$WF_RUN_ID"
          [ -z "$RID" ] && RID="$INPUT_RUN_ID"
          if [ -n "$RID" ] && ! [[ "$RID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id inválido (solo dígitos)"; exit 1
          fi
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow "AG-01 Orquestador" --branch main --status success \
                  --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "Origen: run $RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: informe-ag01
          path: ${{ runner.temp }}/informe
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abrir PRs de remediación
        env:
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python scripts/remediar.py "$RUNNER_TEMP/informe/findings.json" \
            --max-open "$MAX_OPEN_PRS" --stale-days 14 \
            --summary "$RUNNER_TEMP/remediacion.md" \
            $DRY_RUN_FLAG
          cat "$RUNNER_TEMP/remediacion.md" >> "$GITHUB_STEP_SUMMARY"